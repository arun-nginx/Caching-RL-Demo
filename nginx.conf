user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log info;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;

    log_format demo
        '$remote_addr "$request" status=$status '
        'cache=$upstream_cache_status '
        'limit=$limit_req_status '
        'request_time=$request_time '
        'upstream_time=$upstream_response_time';

    access_log /var/log/nginx/demo-access.log demo;
    access_log /dev/stdout demo;

    # Rate is tracked per client IP.
    limit_req_zone $binary_remote_addr
                   zone=ci_clients:10m
                   rate=5r/s;

    proxy_cache_path /var/cache/nginx/artifacts
                     levels=1:2
                     keys_zone=artifact_cache:10m
                     max_size=256m
                     inactive=10m
                     use_temp_path=off;

    # Conservative demonstration policy:
    # never read/write shared cache for credentials or cookies.
    map $http_authorization $skip_auth {
        ""      0;
        default 1;
    }

    map $http_cookie $skip_cookie {
        ""      0;
        default 1;
    }

    upstream artifact_origin {
        zone artifact_origin 64k;
        server 127.0.0.1:8081;
        keepalive 16;
    }

    server {
        # Demo access port
        listen 8080;
        server_name localhost;

        # NGINX Plus live server metrics.
        status_zone artifact_demo;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;

        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;

        # NGINX Plus read-only monitoring API.
        location /api/ {
            api write=off;
            allow 127.0.0.1;
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            deny all;
        }

        location = /dashboard.html {
            root /usr/share/nginx/html;
        }

        # Keep this demonstration separate from caching.
        location /rate-test/ {
            limit_req zone=ci_clients burst=5 nodelay;
            limit_req_status 429;
            limit_req_log_level notice;

            add_header X-Rate-Limit-Status $limit_req_status always;

            proxy_pass http://artifact_origin;
        }

        location /artifactory/ {
            proxy_pass http://artifact_origin;

            # Plus-only active health checking.
            health_check uri=/health interval=5s fails=2 passes=1;

            # This route is only for downloads.
            limit_except GET {
                deny all;
            }

            proxy_cache artifact_cache;
            proxy_cache_key "$scheme|$host|$request_uri";
            proxy_cache_valid 200 1m;

            proxy_cache_bypass $skip_auth $skip_cookie;
            proxy_no_cache $skip_auth $skip_cookie;

            # Coalesce concurrent misses for the same cache key.
            proxy_cache_lock on;
            proxy_cache_lock_timeout 5s;

            # Demo policy: permit previously cached content on failure.
            proxy_cache_use_stale error timeout
                                 http_500 http_502 http_503 http_504;

            add_header X-Cache-Status $upstream_cache_status always;
        }

        location / {
            return 200 "NGINX Plus artifact demo\n";
        }
    }
}
